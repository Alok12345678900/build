name: Build APK (Flutter / Gradle Auto)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true
      build_type:
        description: 'release / debug / full-release (fallback; bot normalnya ngirim buildType+perfMode lewat payload)'
        required: false
        default: 'release'

concurrency:
  group: build-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.workers.max=4
        -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Parse payload
        run: |
          set -euo pipefail
          echo '${{ github.event.inputs.payload }}' > payload.json
          cat payload.json
          ZIP_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)
          if [ -z "$ZIP_URL" ]; then
            echo "::error::Tidak ada zipAssetUrl / url di payload"
            exit 1
          fi
          echo "ZIP_URL=$ZIP_URL" >> "$GITHUB_ENV"

          # ── Mode build efektif ──────────────────────────────────────────
          # Bot ngirim buildType + perfMode di dalam payload (bukan input build_type).
          # perfMode: fast = arm64 | low = arm32+arm64 | full = SEMUA ABI (full release)
          BT_INPUT="${{ github.event.inputs.build_type }}"
          BT=$(jq -r '.buildType // empty' payload.json)
          PERF=$(jq -r '.perfMode // empty' payload.json)
          [ -z "$BT" ] && BT="$BT_INPUT"
          [ -z "$BT" ] && BT=release
          [ -z "$PERF" ] && PERF=fast
          if [ "$BT" = "full-release" ]; then PERF=full; fi
          if [ "$PERF" = "full" ]; then BT=full-release; fi
          case "$BT" in debug|release|full-release) ;; *) BT=release ;; esac
          case "$PERF" in fast|low|full) ;; *) PERF=fast ;; esac
          echo "▶ Mode build: BT=$BT PERF=$PERF"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "PERF=$PERF" >> "$GITHUB_ENV"

      - name: Validasi input wajib (full-release)
        if: env.BT == 'full-release'
        env:
          JOB_ID: ${{ github.event.inputs.jobId }}
        run: |
          if [ -z "$ZIP_URL" ]; then
            echo "::error::ZIP_URL kosong."
            exit 1
          fi

          if [ -z "$JOB_ID" ]; then
            echo "::error::Input jobId kosong."
            exit 1
          fi

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf project_raw project.zip
          mkdir -p project_raw

          if [[ "$ZIP_URL" == *"api.github.com"* ]]; then
            curl -fL --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o project.zip "$ZIP_URL"
          else
            curl -fL --retry 3 --retry-delay 5 -o project.zip "$ZIP_URL"
          fi

          if [ ! -s project.zip ]; then
            echo "::error::File ZIP kosong."
            exit 1
          fi

          ls -lh project.zip

      - name: Validate ZIP archive (full-release)
        if: env.BT == 'full-release'
        run: |
          python3 - <<'PY'
          import sys
          import zipfile

          path = "project.zip"

          if not zipfile.is_zipfile(path):
              print("::error::File yang diunduh bukan ZIP valid.")
              sys.exit(1)

          try:
              with zipfile.ZipFile(path) as archive:
                  entries = archive.infolist()
                  files = [
                      item for item in entries
                      if not item.is_dir()
                      and not item.filename.endswith("/")
                  ]

                  for item in files:
                      try:
                          with archive.open(item, "r") as stream:
                              while stream.read(1024 * 1024):
                                  pass
                      except Exception as exc:
                          print(
                              f"::error::ZIP rusak pada file "
                              f"{item.filename}: {exc}"
                          )
                          sys.exit(1)

                  print(
                      f"Validasi selesai: {len(files)} file diperiksa."
                  )

          except (zipfile.BadZipFile, OSError) as exc:
              print(f"::error::Arsip ZIP tidak bisa dibaca: {exc}")
              sys.exit(1)
          PY

      - name: Extract ZIP (full-release, safe extract)
        if: env.BT == 'full-release'
        run: |
          set -euo pipefail
          rm -rf project_raw
          mkdir -p project_raw

          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          from shutil import copyfileobj

          archive_path = Path("project.zip")
          destination = Path("project_raw").resolve()

          with zipfile.ZipFile(archive_path) as archive:
              for info in archive.infolist():
                  name = info.filename.replace("\\", "/")

                  if info.is_dir() or name.endswith("/"):
                      continue

                  target = (destination / name).resolve()

                  if target != destination and destination not in target.parents:
                      raise SystemExit(
                          f"::error::Path tidak aman di ZIP: {name}"
                      )

                  target.parent.mkdir(parents=True, exist_ok=True)

                  try:
                      with archive.open(info, "r") as source:
                          with open(target, "wb") as output:
                              copyfileobj(source, output)
                  except Exception as exc:
                      raise SystemExit(
                          f"::error::Gagal mengekstrak {name}: {exc}"
                      )

          print("Ekstraksi ZIP selesai.")
          PY

          # Kalau ZIP cuma berisi 1 folder root yang isinya project Flutter → naikin isinya
          shopt -s nullglob dotglob
          entries=(project_raw/*/)

          if [ "${#entries[@]}" -eq 1 ] && \
             [ -f "${entries[0]}pubspec.yaml" ]; then
            tmp="$(mktemp -d)"
            mv "${entries[0]}"* "$tmp"/
            rm -rf project_raw
            mv "$tmp" project_raw
          fi

      - name: Extract ZIP
        if: env.BT != 'full-release'
        run: |
          set -euo pipefail
          unzip -q project.zip -d project_raw

      - name: Show project structure
        run: |
          set -euo pipefail
          echo "=== Struktur root project_raw ==="
          find project_raw -maxdepth 3 -type d | head -50
          echo ""
          echo "=== File kunci ==="
          find project_raw -maxdepth 6 -type f \
            \( -name "gradlew" -o -name "pubspec.yaml" \
               -o -name "settings.gradle" -o -name "settings.gradle.kts" \
               -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "*/build/*" | head -30

      - name: Detect project type
        id: detect
        run: |
          set -euo pipefail
          PUBSPEC=$(find project_raw -type f -name pubspec.yaml \
                    -not -path "*/build/*" -not -path "*/.dart_tool/*" | head -n 1)
          GRADLEW=$(find project_raw -type f -name gradlew \
                    -not -path "*/build/*" | head -n 1)
          SETTINGS=$(find project_raw -type f \
                    \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                    -not -path "*/build/*" | head -n 1)

          echo "pubspec : ${PUBSPEC:-<none>}"
          echo "gradlew : ${GRADLEW:-<none>}"
          echo "settings: ${SETTINGS:-<none>}"

          if [ -n "$PUBSPEC" ]; then
            DIR=$(dirname "$PUBSPEC")
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
            echo "✅ Flutter project → $DIR"
          elif [ -n "$GRADLEW" ]; then
            DIR=$(dirname "$GRADLEW")
            echo "type=gradle"  >> "$GITHUB_OUTPUT"
            echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
            echo "✅ Native Gradle project → $DIR"
          elif [ -n "$SETTINGS" ]; then
            DIR=$(dirname "$SETTINGS")
            echo "type=gradle"  >> "$GITHUB_OUTPUT"
            echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
            echo "✅ Gradle project (no wrapper) → $DIR"
          else
            echo "::error::Project tidak dikenali (bukan Flutter / bukan Gradle)."
            find project_raw -maxdepth 3
            exit 1
          fi

      - name: Validasi pubspec.yaml (full-release)
        if: env.BT == 'full-release' && steps.detect.outputs.type == 'flutter'
        run: |
          if [ ! -f "${{ steps.detect.outputs.dir }}/pubspec.yaml" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            ls -la "${{ steps.detect.outputs.dir }}"
            exit 1
          fi
          echo "✅ pubspec.yaml OK"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Cache pub packages
        if: steps.detect.outputs.type == 'flutter'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('project_raw/**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('project_raw/**/*.gradle*', 'project_raw/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Tune gradle.properties
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then
            GP="${{ steps.detect.outputs.dir }}/android/gradle.properties"
          else
            GP="${{ steps.detect.outputs.dir }}/gradle.properties"
          fi
          mkdir -p "$(dirname "$GP")"
          touch "$GP"
          sed -i '/org.gradle.jvmargs/d;/org.gradle.parallel/d;/org.gradle.caching/d;/org.gradle.daemon/d;/org.gradle.configureondemand/d;/org.gradle.workers.max/d' "$GP" || true
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.daemon=false"
            echo "org.gradle.configureondemand=true"
            echo "org.gradle.workers.max=4"
          } >> "$GP"

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          flutter config --no-analytics >/dev/null 2>&1 || true
          flutter pub get
          # BT & PERF sudah dihitung di step "Parse payload"

          if [ "$BT" = "full-release" ]; then
            echo "🚀 FULL RELEASE: fat APK semua ABI (armeabi-v7a, arm64-v8a, x86_64)"
            flutter build apk --release \
              --target-platform=android-arm,android-arm64,android-x64 \
              --no-pub 2>&1 | tee build.log
          else
            if [ "$PERF" = "low" ]; then
              PLATFORMS="android-arm,android-arm64"   # support HP lama (arm32 + arm64)
            else
              PLATFORMS="android-arm64"               # kencang: arm64 aja
            fi
            echo "⚡ Build $BT • perf=$PERF • platform=$PLATFORMS"
            flutter build apk --$BT \
              --target-platform=$PLATFORMS \
              --no-tree-shake-icons \
              --no-shrink \
              --no-pub 2>&1 | tee build.log
          fi

      - name: Build Native APK
        if: steps.detect.outputs.type == 'gradle'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          # BT & PERF sudah dihitung di step "Parse payload"
          if [ "$PERF" = "low" ]; then
            ABI_ARG="-Pandroid.injected.build.abi=armeabi-v7a,arm64-v8a"
          elif [ "$PERF" = "full" ]; then
            ABI_ARG=""   # full release: jangan batasi ABI
          else
            ABI_ARG="-Pandroid.injected.build.abi=arm64-v8a"
          fi
          if [ "$BT" = "debug" ]; then TASK="assembleDebug"; else TASK="assembleRelease"; fi

          if [ -f gradlew ]; then
            chmod +x gradlew
            CMD="./gradlew"
            echo "✅ Pakai gradle wrapper"
          else
            echo "⚠️ gradlew tidak ada, generate wrapper dulu"
            gradle wrapper --gradle-version 8.7 || true
            if [ -f gradlew ]; then
              chmod +x gradlew
              CMD="./gradlew"
            else
              CMD="gradle"
            fi
          fi

          echo "Running: $CMD $TASK"
          $CMD "$TASK" \
            --parallel --build-cache \
            $ABI_ARG 2>&1 | tee build.log || {
              echo "::error::Build gagal. Cek log di atas."
              tail -100 build.log
              exit 1
            }

      - name: Debug - scan all APK
        if: failure()
        run: |
          echo "=== SEMUA APK di project_raw ==="
          find project_raw -type f -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "TIDAK ADA APK"
          echo ""
          echo "=== Tree project_raw/app/build/outputs ==="
          find project_raw -type d -name "outputs" -exec find {} -maxdepth 3 -type d \; 2>/dev/null || true
          echo ""
          echo "=== File di outputs ==="
          find project_raw -type d -name "outputs" -exec find {} -type f \; 2>/dev/null || true

      - name: Locate APK
        id: locate
        run: |
          set -euo pipefail
          APK=""

          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then
            LOG="${{ steps.detect.outputs.dir }}/build.log"
            if [ -f "$LOG" ]; then
              REL=$(grep -oE 'Built [^ ]+\.apk' "$LOG" | tail -n1 | sed -E 's/^Built //')
              if [ -n "$REL" ]; then
                CAND="${{ steps.detect.outputs.dir }}/$REL"
                if [ -f "$CAND" ]; then
                  APK="$CAND"
                  echo "✅ APK dari build.log (path resmi Flutter): $APK"
                else
                  echo "⚠️ build.log nyebut '$REL' tapi file-nya gak ada di $CAND"
                fi
              else
                echo "⚠️ Gak nemu baris 'Built ...apk' di build.log"
              fi
            fi
          fi

          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 1 (exclude intermediates/tmp/kotlin/.gradle)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -not -path "*/intermediates/*" \
                  -not -path "*/tmp/*" \
                  -not -path "*/kotlin/*" \
                  -not -path "*/.gradle/*" \
                  2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 2 (include intermediates)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -not -path "*/.gradle/*" \
                  2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 3 (flutter-build path)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -path "*/flutter-build/*" \
                  2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah semua strategy."
            echo "=== Isi build.log (100 baris terakhir) ==="
            tail -100 "${{ steps.detect.outputs.dir }}/build.log" 2>/dev/null || echo "(build.log tidak ada)"
            echo ""
            echo "=== Full tree project_raw/app/build ==="
            find project_raw -type d -name "build" -exec find {} -maxdepth 4 -type d \; 2>/dev/null | head -50 || true
            echo ""
            echo "=== Semua file .apk (full scan) ==="
            find / -type f -name "*.apk" 2>/dev/null | grep -v "/proc/" | head -20 || true
            exit 1
          fi

          APK_DIR=$(dirname "$APK")
          APK_SIZE=$(stat -c%s "$APK" 2>/dev/null || echo "0")
          echo "✅ APK ditemukan: $APK"
          echo "📁 Folder: $APK_DIR"
          echo "📦 Size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 1000 ]; then
            echo "::error::APK terlalu kecil ($APK_SIZE bytes), kemungkinan corrupt."
            exit 1
          fi

          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          compression-level: 0
          retention-days: ${{ env.BT == 'full-release' && 7 || 1 }}
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.jobId }}
          path: |
            ${{ steps.detect.outputs.dir }}/build.log
            ${{ steps.detect.outputs.dir }}/android/build.log
          if-no-files-found: ignore
          retention-days: 1

name: Flutter Build APK FULL RELEASE

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter (GitHub Release asset)"
        required: true
        type: string
      tag:
        description: "Tag unik build"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validasi input wajib
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$ZIP_URL" ]; then
            echo "::error::Input zip_url kosong."
            exit 1
          fi

          if [ -z "$BUILD_TAG" ]; then
            echo "::error::Input tag kosong."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Download ZIP project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          curl --location --fail --show-error \
            --retry 3 \
            --retry-delay 2 \
            --output project.zip \
            "$ZIP_URL"

          if [ ! -s project.zip ]; then
            echo "::error::File ZIP kosong."
            exit 1
          fi

          ls -lh project.zip

      - name: Validate ZIP archive
        run: |
          python3 - <<'PY'
          import sys
          import zipfile

          path = "project.zip"

          if not zipfile.is_zipfile(path):
              print("::error::File yang diunduh bukan ZIP valid.")
              sys.exit(1)

          try:
              with zipfile.ZipFile(path) as archive:
                  entries = archive.infolist()
                  files = [
                      item for item in entries
                      if not item.is_dir()
                      and not item.filename.endswith("/")
                  ]

                  for item in files:
                      try:
                          with archive.open(item, "r") as stream:
                              while stream.read(1024 * 1024):
                                  pass
                      except Exception as exc:
                          print(
                              f"::error::ZIP rusak pada file "
                              f"{item.filename}: {exc}"
                          )
                          sys.exit(1)

                  print(
                      f"Validasi selesai: {len(files)} file diperiksa."
                  )

          except (zipfile.BadZipFile, OSError) as exc:
              print(f"::error::Arsip ZIP tidak bisa dibaca: {exc}")
              sys.exit(1)
          PY

      - name: Extract ZIP
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project

          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          from shutil import copyfileobj

          archive_path = Path("project.zip")
          destination = Path("project").resolve()

          with zipfile.ZipFile(archive_path) as archive:
              for info in archive.infolist():
                  name = info.filename.replace("\\", "/")

                  if info.is_dir() or name.endswith("/"):
                      continue

                  target = (destination / name).resolve()

                  if target != destination and destination not in target.parents:
                      raise SystemExit(
                          f"::error::Path tidak aman di ZIP: {name}"
                      )

                  target.parent.mkdir(parents=True, exist_ok=True)

                  try:
                      with archive.open(info, "r") as source:
                          with open(target, "wb") as output:
                              copyfileobj(source, output)
                  except Exception as exc:
                      raise SystemExit(
                          f"::error::Gagal mengekstrak {name}: {exc}"
                      )

          print("Ekstraksi ZIP selesai.")
          PY

          shopt -s nullglob dotglob
          entries=(project/*/)

          if [ "${#entries[@]}" -eq 1 ] && \
             [ -f "${entries[0]}pubspec.yaml" ]; then
            tmp="$(mktemp -d)"
            mv "${entries[0]}"* "$tmp"/
            rm -rf project
            mv "$tmp" project
          fi

      - name: Validasi pubspec.yaml
        run: |
          if [ ! -f project/pubspec.yaml ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            ls -la project
            exit 1
          fi

      - name: Flutter pub get
        working-directory: project
        run: flutter pub get

      - name: Build FULL RELEASE APK
        working-directory: project
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Upload FULL RELEASE APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FULL-RELEASE-${{ inputs.tag }}
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7